services:
  - type: web
    name: student-portal
    env: node
    buildCommand: npm run install:all && npm run build --prefix client
    startCommand: npm start --prefix server
    envVars:
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: NODE_ENV
        value: production
